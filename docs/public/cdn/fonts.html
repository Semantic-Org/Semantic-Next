<!DOCTYPE html>
<html>
<head>
  <title>CDN Test: Fonts</title>
  <link href="https://cdn.semantic-ui.com/css@canary" rel="stylesheet" />
  <link href="https://cdn.semantic-ui.com/fonts@canary/lato" rel="stylesheet" />
  <style>body { padding: 2rem; font-family: 'Lato', sans-serif; } .row { display: flex; gap: 2rem; margin-top: 1rem; }</style>
</head>
<body>
  <h2>Font: Lato from CDN</h2>
  <div class="row">
    <span style="font-weight: 400;">Regular 400</span>
    <span style="font-weight: 400; font-style: italic;">Italic 400</span>
    <span style="font-weight: 600;">Semibold 600</span>
    <span style="font-weight: 600; font-style: italic;">Semibold Italic 600</span>
    <span style="font-weight: 700;">Bold 700</span>
    <span style="font-weight: 700; font-style: italic;">Bold Italic 700</span>
  </div>
</body>
</html>
