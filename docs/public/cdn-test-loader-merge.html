<!DOCTYPE html>
<html>
<head>
  <title>CDN Loader Test: Import Map Merge</title>
  <script type="importmap">
  {
    "imports": {
      "confetti": "https://esm.sh/canvas-confetti@1.9.3"
    }
  }
  </script>
  <script src="https://cdn.semantic-ui.com/load" version="canary" components="button,icon"></script>
  <style>
    body { padding: 2rem; font-family: sans-serif; }
    #log { white-space: pre-wrap; font-family: monospace; font-size: 13px; }
    .error { color: red; }
    .ok { color: green; }
    .test-row { display: flex; gap: 1rem; align-items: center; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Loader Test: Import Map Merge</h1>
  <p>User import map has <code>confetti</code> from esm.sh. SUI loader adds its own map. Both should resolve.</p>
  <div id="log"></div>

  <div class="test-row">
    <ui-button primary class="confetti-btn"><ui-icon star></ui-icon> Confetti</ui-button>
  </div>

  <script>
    const log = document.getElementById('log');
    function msg(text, type) {
      const line = document.createElement('div');
      line.className = type || '';
      line.textContent = text;
      log.appendChild(line);
    }
    window.addEventListener('error', e => msg('Error: ' + e.message, 'error'));
    window.addEventListener('unhandledrejection', e => msg('Rejected: ' + e.reason, 'error'));
  </script>

  <script type="module">
    import confetti from 'confetti';
    import { $ } from '@semantic-ui/query';

    await customElements.whenDefined('ui-button');
    msg('ui-button: defined (SUI import map)', 'ok');

    msg('confetti: ' + (typeof confetti === 'function' ? 'loaded (user import map)' : 'FAILED'), typeof confetti === 'function' ? 'ok' : 'error');

    $('.confetti-btn').on('click', () => confetti());
  </script>
</body>
</html>
