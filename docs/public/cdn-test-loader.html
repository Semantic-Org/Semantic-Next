<!DOCTYPE html>
<html>
<head>
  <title>CDN Loader Test</title>
  <script src="https://cdn.semantic-ui.com/load" version="canary" components="button,icon"></script>
  <style>
    body { padding: 2rem; font-family: sans-serif; }
    section { margin-bottom: 2rem; border: 1px solid #eee; padding: 1rem; border-radius: 8px; }
    h2 { margin-top: 0; }
    .test-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    #log { white-space: pre-wrap; font-family: monospace; font-size: 13px; }
    .error { color: red; }
    .ok { color: green; }
  </style>
</head>
<body>
  <h1>Loader Test: components="button,icon"</h1>
  <div id="log"></div>

  <section>
    <h2>Button + Icon</h2>
    <div class="test-row">
      <ui-button primary><ui-icon home></ui-icon> Home</ui-button>
      <ui-button><ui-icon upload></ui-icon> Upload</ui-button>
      <ui-button positive><ui-icon save></ui-icon> Save</ui-button>
    </div>
  </section>

  <script>
    const log = document.getElementById('log');
    function msg(text, type) {
      const line = document.createElement('div');
      line.className = type || '';
      line.textContent = text;
      log.appendChild(line);
    }
    window.addEventListener('error', e => msg('Error: ' + e.message, 'error'));
    window.addEventListener('unhandledrejection', e => msg('Rejected: ' + e.reason, 'error'));
  </script>

  <script type="module">
    await customElements.whenDefined('ui-button');
    msg('ui-button: defined', 'ok');

    await customElements.whenDefined('ui-icon');
    msg('ui-icon: defined', 'ok');

    const iconVar = getComputedStyle(document.documentElement).getPropertyValue('--icon-home');
    msg('--icon-home: ' + (iconVar ? 'resolved' : 'MISSING'), iconVar ? 'ok' : 'error');

    const fontsReady = await document.fonts.ready;
    const latoLoaded = [...fontsReady].some(f => f.family === 'Lato' && f.status === 'loaded');
    msg('Lato font: ' + (latoLoaded ? 'loaded' : 'not loaded'), latoLoaded ? 'ok' : 'error');

    const primary = getComputedStyle(document.documentElement).getPropertyValue('--primary-color');
    msg('--primary-color: ' + (primary ? 'resolved' : 'MISSING'), primary ? 'ok' : 'error');
  </script>
</body>
</html>
