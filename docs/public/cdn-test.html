<!DOCTYPE html>
<html>
<head>
  <title>CDN Test</title>
  <link href="https://cdn.semantic-ui.com/css@canary" rel="stylesheet" />
  <style>
    body { padding: 2rem; font-family: sans-serif; }
    section { margin-bottom: 2rem; border: 1px solid #eee; padding: 1rem; border-radius: 8px; }
    h2 { margin-top: 0; }
    .test-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    #log { white-space: pre-wrap; font-family: monospace; font-size: 13px; }
    .error { color: red; }
    .ok { color: green; }
  </style>
</head>
<body>
  <h1>CDN Test</h1>
  <div id="log"></div>

  <!-- Test 1: Combo endpoint — primitives -->
  <section>
    <h2>1. Combo: button,input</h2>
    <div class="test-row">
      <ui-button primary>Button</ui-button>
      <ui-input placeholder="Type here..."></ui-input>
    </div>
  </section>

  <!-- Test 2: Combo endpoint — primitive + component -->
  <section>
    <h2>2. Combo: button,panels</h2>
    <div class="test-row">
      <ui-panels>
        <div>Panel A</div>
        <div>Panel B</div>
      </ui-panels>
    </div>
  </section>

  <!-- Test 3: Behavior via import map -->
  <section>
    <h2>3. Behavior: tooltip (import map)</h2>
    <div class="test-row">
      <ui-button class="tooltip-test" data-text="Hello from CDN!">Hover for tooltip</ui-button>
      <ui-button class="tooltip-test" data-header="Tip" data-text="With header" data-position="bottom">Bottom tooltip</ui-button>
    </div>
  </section>

  <script>
    const log = document.getElementById('log');
    function msg(text, type) {
      const line = document.createElement('div');
      line.className = type || '';
      line.textContent = text;
      log.appendChild(line);
    }
    window.addEventListener('error', e => msg('Error: ' + e.message, 'error'));
    window.addEventListener('unhandledrejection', e => msg('Rejected: ' + e.reason, 'error'));
  </script>

  <!-- Combo loads (no import map needed) -->
  <script type="module" src="https://cdn.semantic-ui.com/core@canary/button,input"></script>
  <script type="module" src="https://cdn.semantic-ui.com/core@canary/panels"></script>

  <!-- Behavior needs import map — behaviors aren't standalone CDN files -->
  <script src="https://cdn.semantic-ui.com/importmap@canary.js"></script>
  <script type="module">
    import { Tooltip } from '@semantic-ui/core';
    import { $ } from '@semantic-ui/query';

    // Wait for button to be defined first
    await customElements.whenDefined('ui-button');
    msg('ui-button: defined', 'ok');

    await customElements.whenDefined('ui-input');
    msg('ui-input: defined', 'ok');

    await customElements.whenDefined('ui-panels');
    msg('ui-panels: defined', 'ok');

    // Initialize tooltips
    $('.tooltip-test').tooltip();
    msg('tooltip: initialized', 'ok');
  </script>
</body>
</html>
