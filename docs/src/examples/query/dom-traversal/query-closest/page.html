<p>Find the closest ancestor matching a selector</p>

<div class="container">
  <div class="section active">
    <div class="content">
      <span class="target">Target element</span>
    </div>
  </div>
</div>

<p>Closest .section: <span class="section"></span></p>
<p>Closest .container: <span class="container"></span></p>
<p>Closest .active: <span class="active"></span></p>
