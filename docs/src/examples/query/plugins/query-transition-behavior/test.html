<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition Test</title>
  <style>
    body {
      padding: 2rem;
      font-family: system-ui;
    }
    
    .test-box {
      width: 200px;
      height: 100px;
      background: #2185d0;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1rem 0;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Transition Behavior Test</h1>
  
  <div class="test-box transition hidden">Test Box</div>
  
  <button id="test">Run Transition</button>

  <script type="module">
    import { $ } from '@semantic-ui/query';
    import '@semantic-ui/core/behaviors/transition';
    
    $('#test').on('click', () => {
      // This should auto-detect visibility and toggle
      $('.test-box').transition('fade');
    });
  </script>
</body>
</html>
