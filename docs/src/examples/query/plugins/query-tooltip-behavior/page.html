<div class="demo">
  <div class="section">
    <h3>Hover Tooltips</h3>
    <div class="buttons">
      <ui-button class="basic" data-text="Hello from tooltip!">Hover me</ui-button>
      <ui-button class="with-header" data-header="Pro Tip" data-text="You can combine header and text">With header</ui-button>
      <ui-button class="positioned" data-text="I'm on the bottom" data-position="bottom">Bottom position</ui-button>
      <ui-button class="compound" data-text="Bottom left corner" data-position="bottom left">Compound position</ui-button>
    </div>
  </div>

  <div class="section">
    <h3>Options</h3>
    <div class="buttons">
      <ui-button class="hoverable" data-html="You can <a href='#'>click this link</a>">Hoverable</ui-button>
      <ui-button class="no-arrow" data-text="No arrow on this one">No arrow</ui-button>
      <ui-button class="no-preserve" data-text="Removed from DOM after hiding">No preserve</ui-button>
    </div>
  </div>

  <div class="section">
    <h3>Click Tooltip</h3>
    <div class="buttons">
      <ui-button class="click-trigger" data-text="Click again to close">Click me</ui-button>
    </div>
  </div>
</div>
