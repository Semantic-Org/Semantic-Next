<p>Reverse the order of elements in a Query collection</p>

<div class="container">
  <div class="item" data-order="1">First Item</div>
  <div class="item" data-order="2">Second Item</div>
  <div class="item" data-order="3">Third Item</div>
  <div class="item" data-order="4">Fourth Item</div>
</div>

<div class="controls">
  <button class="reverse-btn">Reverse Order</button>
  <button class="reset-btn">Reset Order</button>
</div>

<div class="output">
  Current order: <span class="order-display">1, 2, 3, 4</span>
</div>
