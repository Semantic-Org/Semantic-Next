<p>Get and set values of form elements</p>

<div class="form">
  <input type="text" class="input" placeholder="Enter text here">
  <select class="select">
    <option value="">Choose option</option>
    <option value="option1">Option 1</option>
    <option value="option2">Option 2</option>
  </select>
  <textarea class="textarea" placeholder="Enter longer text"></textarea>
</div>

<div class="controls">
  <ui-button class="set">Set Values</ui-button>
  <ui-button class="clear">Clear Values</ui-button>
</div>

<div class="output">
  Type in the form fields to see values update
</div>
