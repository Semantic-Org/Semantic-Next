<p>Get or set the outer HTML including the element's own tag</p>

<div class="box" id="demo">
  <strong>Bold text</strong> and <em>italic text</em>
</div>

<div class="card">
  <h3>Card Title</h3>
  <p>Card content</p>
</div>

<p>Box outer HTML:</p>
<pre class="boxhtml"></pre>

<p>Card outer HTML:</p>
<pre class="cardhtml"></pre>
