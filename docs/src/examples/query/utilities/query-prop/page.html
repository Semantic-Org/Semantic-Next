<p>Get and set DOM element properties (not attributes)</p>

<input type="checkbox" class="checkbox" id="agree">
<label for="agree">I agree to the terms</label>

<input type="text" class="input" value="Initial value" disabled>

<select class="select">
  <option value="1">Option 1</option>
  <option value="2" selected>Option 2</option>
  <option value="3">Option 3</option>
</select>

<p>Checkbox checked: <span class="checked"></span></p>
<p>Input disabled: <span class="disabled"></span></p>
<p>Select selectedIndex: <span class="index"></span></p>
<p>Input value: <span class="value"></span></p>
