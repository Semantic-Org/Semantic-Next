<p>Get and set DOM element properties (not attributes)</p>

<div class="form">
  <input type="checkbox" class="checkbox" id="agree">
  <label for="agree">I agree to the terms</label>
  
  <input type="text" class="input" value="Initial value" disabled>
  
  <select class="select">
    <option value="1">Option 1</option>
    <option value="2" selected>Option 2</option>
    <option value="3">Option 3</option>
  </select>
</div>

<div class="properties">
  <div class="prop-item">Checkbox checked: <span class="checkbox-checked"></span></div>
  <div class="prop-item">Input disabled: <span class="input-disabled"></span></div>
  <div class="prop-item">Select selectedIndex: <span class="select-index"></span></div>
  <div class="prop-item">Input value: <span class="input-value"></span></div>
</div>
