<h3>Controls</h3>
<ui-button class="set">Change Progress</ui-button>
<ui-button green class="complete">Complete</ui-button>

<h3>Standard</h3>
<progress-bar value="75"></progress-bar>

<h3>Sizes</h3>
<div class="example">
  <h4>Mini</h4>
  <progress-bar value="20" size="mini"></progress-bar>
</div>
<div class="example">
  <h4>Small</h4>
  <progress-bar value="50" size="small"></progress-bar>
</div>
<div class="example">
  <h4>Medium</h4>
  <progress-bar value="65" size="medium"></progress-bar>
</div>
<div class="example">
<h4>Large</h4>
  <progress-bar value="80" size="large"></progress-bar>
</div>

<h3>Styles</h3>
<div class="example">
  <h4>Success</h4>
  <progress-bar value="90" theme="success"></progress-bar>
</div>
<div class="example">
  <h4>Warning</h4>
  <progress-bar value="60" theme="warning"></progress-bar>
</div>
<div class="example">
  <h4>Danger</h4>
  <progress-bar value="30" theme="danger"></progress-bar>
</div>

<h3>Settings</h3>
<div class="example">
  <h4>Without Animation</h4>
  <progress-bar value="45" animated="false"></progress-bar>
</div>
<div class="example">
  <h4>Without Inline Label</h4>
  <progress-bar value="85" inlinelabel="false"></progress-bar>
</div>
<div class="example">
  <h4>Without Label</h4>
  <progress-bar value="85" showlabel="false"></progress-bar>
</div>
