<div class="search">
  <input type="text" placeholder="Search fruit..." value={searchTerm} />
  {#if canSearch}
    <div class="results">
      {#async getResults searchTerm as searchResults}
        {#if hasAny searchResults}
          {#each searchResults}
            <div class="result" data-id="{id}" data-title="{title}">
              {title}
            </div>
          {/each}
        {else}
          No results found for "<b>{searchTerm}</b>"
        {/if}
      {loading}
        <div class="loading">Retrieving results...</div>
      {error as e}
        <div class="error">Search failed: {e.message}</div>
      {/async}
    </div>
  {/if}
</div>
