<div class="slider {classIf dragging 'dragging'}">
  <div class="fill"   style="width: {dragging ? currentPercentage : ratingPercentage}%"></div>
  <div class="guide"  style="width: {dragging ? ratingPercentage : 0}%"></div>
  <div class="track"></div>
  <div class="area">
    <div class="handle" style="left: {dragging ? currentPercentage : ratingPercentage}%"></div>
  </div>
</div>

{#if showLabels}
  <div class="labels">
    {#each value in range(min, max + 1) }
      <div class="label {classIf (rating == value) 'current'}">
        {value}
      </div>
    {/each}
  </div>
{/if}

<ui-button class="reset" blue>Reset</ui-button>
