<html>
  <head>
    <script src="https://cdn.semantic-ui.com/load" version="canary" components="standard" css></script>
<!-- playground-hide -->
    <script>
      const parentTheme = window.frameElement?.ownerDocument?.documentElement;
      const isDark = parentTheme
        ? parentTheme.classList.contains('dark')
        : localStorage.getItem('theme') == 'dark';
      if(isDark) {
        document.querySelector('html').classList.add('dark');
      }
    </script>
<!-- playground-hide-end -->
  </head>
  <body>
    <ui-button primary>Button</ui-button>
    <ui-input search></ui-input>
  </body>
</html>
