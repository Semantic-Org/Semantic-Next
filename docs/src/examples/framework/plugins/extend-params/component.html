<div class="card">

    <div class="currencies">
      <ui-button small data-currency="USD">USD</ui-button>
      <ui-button small data-currency="EUR">EUR</ui-button>
      <ui-button small data-currency="JPY">JPY</ui-button>
    </div>
  </div>
  <div class="row">
    <span>Starter</span>
    <b>{formatPrice 12}</b>
  </div>
  <div class="row">
    <span>Pro</span>
    <b>{formatPrice 29}</b>
  </div>
</div>
