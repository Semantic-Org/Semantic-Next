<div class="card">
  <div class="header">
    <h3>{t 'title'}</h3>
    <div class="locales">
      <ui-button small active={is locale 'en'} data-locale="en">EN</ui-button>
      <ui-button small active={is locale 'es'} data-locale="es">ES</ui-button>
      <ui-button small active={is locale 'ja'} data-locale="ja">JA</ui-button>
    </div>
  </div>
  <div class="line">
    <span>{t 'subtotal'}</span>
    <b>$48.00</b>
  </div>
  <ui-button primary fluid>{t 'placeOrder'}</ui-button>
</div>
