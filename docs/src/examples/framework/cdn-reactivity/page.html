<html>
  <head>
    <script src="https://cdn.semantic-ui.com/load" version="canary" reactivity css></script>
    <script type="module">
      import { Signal, reaction } from '@semantic-ui/reactivity';

      const count = new Signal(0);
      const doubled = count.derive(n => n * 2);

      reaction(() => {
        document.querySelector('#count').textContent = count.value;
        document.querySelector('#doubled').textContent = doubled.value;
      });

      setInterval(() => count.increment(), 1000);
    </script>
<!-- playground-hide -->
    <script>
      const parentTheme = window.frameElement?.ownerDocument?.documentElement;
      const isDark = parentTheme
        ? parentTheme.classList.contains('dark')
        : localStorage.getItem('theme') == 'dark';
      if(isDark) {
        document.querySelector('html').classList.add('dark');
      }
    </script>
<!-- playground-hide-end -->
  </head>
  <body>
    <p>Count: <span id="count">0</span></p>
    <p>Doubled: <span id="doubled">0</span></p>
  </body>
</html>
