<h2>Two attributes sharing a value</h2>
<ui-marker left>left</ui-marker>
<ui-marker left-attached>left-attached</ui-marker>
<ui-marker top>top</ui-marker>

<h2>Opting in drops the bare form</h2>
<ui-marker fade>fade</ui-marker>
<ui-marker fade-animated>fade-animated</ui-marker>

<h2>Value spelling</h2>
<ui-marker corner="top-left">corner="top-left"</ui-marker>
<ui-marker corner="left top">corner="left top"</ui-marker>
