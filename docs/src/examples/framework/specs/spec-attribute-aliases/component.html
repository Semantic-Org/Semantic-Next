<div class="{uiClasses}marker">
  <code class="written"><slot></slot></code>
  {#if floated}<code class="pair">floated="{floated}"</code>{/if}
  {#if attached}<code class="pair">attached="{attached}"</code>{/if}
  {#if corner}<code class="pair">corner="{corner}"</code>{/if}
  {#if animated}<code class="pair">animated="{animated}"</code>{/if}
</div>
