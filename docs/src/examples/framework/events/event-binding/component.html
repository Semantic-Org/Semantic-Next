<p>Width</p>
<ui-button class="decrease width">-</ui-button>
<ui-button class="increase width">+</ui-button>
<p>Height</p>
<ui-button class="decrease height">-</ui-button>
<ui-button class="increase height">+</ui-button>
<hr/>
<div class="circle" style="
  width: { width > 0 ? width : 0 }px;
  height: { height > 0 ? height : 0 }px;
"></div>
