<ul class="playlist">
  {#each song in songs}
    <li class="song {playingClass song.id}">
      <span class="number">{index + 1}</span>
      <span class="title">{song.title}</span>
      <ui-button class="play">Play</ui-button>
      <ui-button class="remove">Remove</ui-button>
    </li>
  {/each}
</ul>
