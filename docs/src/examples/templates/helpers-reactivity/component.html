<h3>guard</h3>
<p>Counter: {counter} - Guarded: <b>{guard getGuardedMessage}</b></p>
<ui-button class="increment">Increment Counter</ui-button>

<h3>nonreactive</h3>
<p>Trigger: {trigger} - Status (non-reactive): <b>{nonreactive getStatusMessage}</b></p>
<ui-button class="toggle-trigger">Toggle Trigger</ui-button>
<ui-button class="toggle-status">Toggle Status</ui-button>
