<div class="palette">
  {#each colorData in getColorData}
    <div class="group">
      <h3 class="name">{colorData.displayName}</h3>
      
      <div class="scale">
        {#each step in colorData.steps}
          <div 
            class="swatch {isColorCopied(colorData.name, step.step) ? 'copied' : ''}"
            style="background-color: var({step.cssVar}); --overlay-color: var({step.textVar});"
            data-color="{colorData.name}"
            data-step="{step.step}"
            title="{step.cssVar}: {step.value}"
          >
            <div class="step">{step.step}</div>
            
            {#if showValues}
              <div class="info">
                <div class="var">{step.cssVar}</div>
                {#if step.value}
                  <div class="value">{step.value}</div>
                {/if}
              </div>
            {/if}
            
            {#if showCopy && isColorCopied(colorData.name, step.step) }
              <div class="copy">
                <span class="icon">✓</span>
                <span>Copied!</span>
              </div>
            {/if}
          </div>
        {/each}
      </div>
    </div>
  {/each}
</div>
