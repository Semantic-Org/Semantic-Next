<div class="palette">
  {#each getColors}
    <div class="group">
      <h3 class="name">{displayName}</h3>
      
      <div class="colors">
        {#each shade in shades}
          <div
            class="swatch {isColorCopied(name, shade.name) ? 'copied' : ''}"
            style="background-color: var({shade.cssVar}); --overlay-color: var({shade.textVar});"
            data-color="{name}"
            data-shade="{shade.name}"
            title="{shade.cssVar}: {shade.value}"
          >
            <div class="shade">{shade.name}</div>

            {#if showValues}
              <div class="info">
                <div class="var">{shade.cssVar}</div>
                {#if shade.value}
                  <div class="value">{shade.value}</div>
                {/if}
              </div>
            {/if}

            {#if showCopy && isColorCopied(name, shade.name) }
              <ui-label mini class="copy">
                <ui-icon check></ui-icon>
                Copied
              </ui-label>
            {/if}
          </div>
        {/each}
      </div>
    </div>
  {/each}
</div>
