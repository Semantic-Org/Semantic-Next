{#if is panel.type 'preview'}
  <ui-panel
    class="iframe preview"
    hidden={panelHidden}
    size="grow"
    exportparts="panel, handle"
  >
    {>CodePlaygroundPreview}
  </ui-panel>
{else if is panel.type 'file'}
  <ui-panel
    class="{classIf minimized 'minimized' ''}code"
    hidden={panelHidden}
    size="{size}"
    max-size="{maxSize}"
    label="{panel.label}"
    exportparts="panel, handle"
  >
    {>CodePlaygroundFile
      filename=panel.filename
      lineNumbers=lineNumbers
      lineWrapping=lineWrapping
    }
  </ui-panel>
{/if}
