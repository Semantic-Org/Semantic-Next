{#if showMenu}
  <div class="menu">
    <ui-menu value={tab} items={getMenu} class="preview" part="menu"></ui-menu>
    {>links}
  </div>
{else}
  {>links}
{/if}
{#if is tab 'preview'}
  <example-preview part="preview" .project={getProject} htmlFile="page.html"></example-preview>
{else if is tab 'ast'}
  <header>
      The AST is a representation of the template content, for more information <a href="/docs/api/templating/ast" target="_blank">see the AST docs</a>.
  </header>
  <pretty-json expand="4">
    {stringify ast}
  </pretty-json>
{/if}

{#snippet links}
  <div class="links">
    <a class="reload link" data-text="Reload Preview">
      <ui-icon rotate-cw link></ui-icon>
    </a>
    {#if exampleURL}
      <a href="{exampleURL}" class="sandbox link" data-text="View in Playground">
        <ui-icon terminal link></ui-icon>
      </a>
    {/if}
  </div>
{/snippet}
