<codeSample class="{classIf attached 'attached'}{classIf segment 'segment'}">
  {#if label}
    <div class="label">
      {label}
      {log label}
    </div>
  {/if}
  {#if copyable}
    <ui-icon link copy data-text="Copy Code"></ui-icon>
  {/if}
  <code class="code {language}">
    {#if formattedCode}
      {#html formattedCode}
    {else}
      {#async formatCode as formattedCode}
        {#html formattedCode}
      {/async}
    {/if}
  </code>
</codeSample>
