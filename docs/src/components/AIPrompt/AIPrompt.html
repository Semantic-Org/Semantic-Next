<div class="prompt {classMap promptClass}">
  <div class="hint">{hint}</div>
  <div class="prompt">
    <input class="input" type="text" placeholder="Describe..." maxlength="150" />
    <ui-button disabled={!hasPrompt} class="submit" icon-only icon="send"></ui-button>
  </div>
  {#if isThinking}
    <div class="thinking cot">
      <ai-loader active></ai-loader>
      <div class="text">
    </div>
  {else}
    <div class="cot">
      <ai-loader></ai-loader>
      <div class="text"></div>
    </div>
  {/if}
</div>

<div class="result {maybeResultsVisible}">
  <div class="preview pane">
    <div class="label">Preview</div>
    <div class="output"></div>
  </div>
  <div class="code pane">
    <div class="label">Code</div>
    <div class="output"></div>
  </div>
  <div class="note"></div>
</div>
