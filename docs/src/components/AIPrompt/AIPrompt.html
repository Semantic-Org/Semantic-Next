<div class="hint {classMap hintClass}">{currentHint}</div>
<div class="bar {classMap barClass}">
  <input class="input" type="text" placeholder="{placeholder}" maxlength="{maxLength}" />
  <ui-button grey subtle class="submit" icon-only icon="send" disabled={cannotSubmit}></ui-button>
</div>
{#if cotVisible}
  <div class="cot {classMap cotClass}">
    <ai-loader size="24" active={isThinking}></ai-loader>
    <span class="text {#if isThinking}shimmer{/if}">{cotText}</span>
  </div>
{/if}
<div class="results {classMap resultsClass}">
  <div class="pane">
    <div class="label">Preview</div>
    <div class="preview">{#html previewHTML}</div>
  </div>
  <div class="pane">
    <div class="label">Code</div>
    <div class="code">{#html codeHTML}</div>
  </div>
  <div class="note {classMap noteClass}">{note}</div>
</div>
