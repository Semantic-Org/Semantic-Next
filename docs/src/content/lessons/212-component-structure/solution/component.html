<div class="profile">
  <img class="avatar" src="{user.avatar}" alt="{user.name}">
  <div class="details">
    <h2 class="name">{user.name}</h2>
    <div class="role">{user.role}</div>
    <div class="contact">
      <div class="email">{user.email}</div>
      <div class="location">{user.location}</div>
    </div>
  </div>
</div>
