<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dropdown — dropdown</title>
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var html = document.documentElement;
        html.classList.add(t);
        html.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="stylesheet" href="/dist/sui.css" />
    <link rel="stylesheet" href="./page.css" />
    <script type="module" blocking="render" src="/dist/sui.js"></script>
    <script type="module" blocking="render" src="/dist/dropdown/component.js"></script>
    <script type="module" blocking="render" src="/dist/dropdown/page.js"></script>
    <style>
      html { scrollbar-gutter: stable; }
      body { font-family: var(--page-font, system-ui, sans-serif); max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
      .example.container { position: relative; transform: translateZ(0); }
      .example.theme { position: fixed; top: 1rem; right: 1rem; z-index: 1000; }
      .example.header { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--standard-15, #e5e5e5); }
      .example.header .back { display: inline-block; font-size: 0.8em; color: var(--standard-50, #888); text-decoration: none; letter-spacing: 0.02em; }
      .example.header .back:hover { color: var(--primary-color, #2185d0); }
      .example.header .title { margin: 0.4rem 0 0.2rem; font-size: 1.25rem; font-weight: 600; }
      .example.header .description { margin: 0; color: var(--standard-60, #666); font-size: 0.9em; line-height: 1.5; }
    </style>
  </head>
  <body>
    <theme-switcher class="example theme"></theme-switcher>
    <header class="example header">
      <a class="back" href="/">← Examples</a>
      <h1 class="title">Dropdown</h1>
      <p class="description">Global events and dynamic class mapping</p>
    </header>
    <div class="example container">
      <h1>Dropdown Examples</h1>
      
      <div class="example-section">
        <h2>Basic Dropdown</h2>
        <div class="example-row">
          <label for="basic-dropdown">Select a fruit:</label>
          <ui-dropdown 
            id="basic-dropdown"
            name="fruit"
            placeholder="Select a fruit"
            options='[
              {"value": "apple", "text": "Apple"},
              {"value": "banana", "text": "Banana"},
              {"value": "orange", "text": "Orange"},
              {"value": "grape", "text": "Grape"},
              {"value": "kiwi", "text": "Kiwi"}
            ]'>
          </ui-dropdown>
          <div id="basic-result" class="selection-result">No selection yet</div>
        </div>
      </div>
      
      <div class="example-section">
        <h2>Dropdown with Icons</h2>
        <div class="example-row">
          <label for="icon-dropdown">Select a social platform:</label>
          <ui-dropdown 
            id="icon-dropdown"
            name="platform"
            placeholder="Select a platform"
            options='[
              {"value": "facebook", "text": "Facebook", "icon": "facebook"},
              {"value": "twitter", "text": "Twitter", "icon": "twitter"},
              {"value": "instagram", "text": "Instagram", "icon": "instagram"},
              {"value": "linkedin", "text": "LinkedIn", "icon": "linkedin"},
              {"value": "youtube", "text": "YouTube", "icon": "youtube"}
            ]'>
          </ui-dropdown>
          <div id="icon-result" class="selection-result">No selection yet</div>
        </div>
      </div>
      
      <div class="example-section">
        <h2>Dropdown Variants</h2>
        <div class="example-row">
          <label>Sizes:</label>
          <ui-dropdown 
            small
            placeholder="Small dropdown"
            options='[
              {"value": "1", "text": "Option 1"},
              {"value": "2", "text": "Option 2"},
              {"value": "3", "text": "Option 3"}
            ]'>
          </ui-dropdown>
          <br><br>
          <ui-dropdown 
            placeholder="Default size"
            options='[
              {"value": "1", "text": "Option 1"},
              {"value": "2", "text": "Option 2"},
              {"value": "3", "text": "Option 3"}
            ]'>
          </ui-dropdown>
          <br><br>
          <ui-dropdown 
            large
            placeholder="Large dropdown"
            options='[
              {"value": "1", "text": "Option 1"},
              {"value": "2", "text": "Option 2"},
              {"value": "3", "text": "Option 3"}
            ]'>
          </ui-dropdown>
        </div>
        
        <div class="example-row">
          <label>Fluid (full-width):</label>
          <ui-dropdown 
            fluid
            placeholder="Fluid dropdown takes full width"
            options='[
              {"value": "1", "text": "Option 1"},
              {"value": "2", "text": "Option 2"},
              {"value": "3", "text": "Option 3"}
            ]'>
          </ui-dropdown>
        </div>
        
        <div class="example-row">
          <label>States:</label>
          <ui-dropdown 
            id="variant-dropdown"
            error
            placeholder="Error state"
            options='[
              {"value": "1", "text": "Option 1"},
              {"value": "2", "text": "Option 2"},
              {"value": "3", "text": "Option 3"}
            ]'>
          </ui-dropdown>
          <br><br>
          <ui-dropdown 
            disabled
            placeholder="Disabled state"
            options='[
              {"value": "1", "text": "Option 1"},
              {"value": "2", "text": "Option 2"},
              {"value": "3", "text": "Option 3"}
            ]'>
          </ui-dropdown>
          <div id="variant-result" class="selection-result">No selection yet</div>
        </div>
        
        <div class="example-row">
          <label>With empty option:</label>
          <ui-dropdown 
            allow-empty
            empty-text="-- Select --"
            options='[
              {"value": "1", "text": "Option 1"},
              {"value": "2", "text": "Option 2"},
              {"value": "3", "text": "Option 3"}
            ]'>
          </ui-dropdown>
        </div>
      </div>
    </div>
  </body>
</html>
