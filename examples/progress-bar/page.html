<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Progress Bar — progress-bar</title>
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var html = document.documentElement;
        html.classList.add(t);
        html.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="stylesheet" href="/dist/sui.css" />
    <link rel="stylesheet" href="./page.css" />
    <script type="module" blocking="render" src="/dist/sui.js"></script>
    <script type="module" blocking="render" src="/dist/progress-bar/component.js"></script>
    <script type="module" blocking="render" src="/dist/progress-bar/page.js"></script>
    <style>
      html { scrollbar-gutter: stable; }
      body { font-family: var(--page-font, system-ui, sans-serif); max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
      .example.container { position: relative; transform: translateZ(0); }
      .example.theme { position: fixed; top: 1rem; right: 1rem; z-index: 1000; }
      .example.header { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--standard-15, #e5e5e5); }
      .example.header .back { display: inline-block; font-size: 0.8em; color: var(--standard-50, #888); text-decoration: none; letter-spacing: 0.02em; }
      .example.header .back:hover { color: var(--primary-color, #2185d0); }
      .example.header .title { margin: 0.4rem 0 0.2rem; font-size: 1.25rem; font-weight: 600; }
      .example.header .description { margin: 0; color: var(--standard-60, #666); font-size: 0.9em; line-height: 1.5; }
    </style>
  </head>
  <body>
    <theme-switcher class="example theme"></theme-switcher>
    <header class="example header">
      <a class="back" href="/">← Examples</a>
      <h1 class="title">Progress Bar</h1>
      <p class="description">A customizable progress bar with animations and themes</p>
    </header>
    <div class="example container">
      <h3>Controls</h3>
      <ui-button class="set">Change Progress</ui-button>
      <ui-button green class="complete">Complete</ui-button>
      
      <h3>Standard</h3>
      <progress-bar value="75"></progress-bar>
      
      <h3>Sizes</h3>
      <div class="example">
        <h4>Mini</h4>
        <progress-bar value="20" size="mini"></progress-bar>
      </div>
      <div class="example">
        <h4>Small</h4>
        <progress-bar value="50" size="small"></progress-bar>
      </div>
      <div class="example">
        <h4>Medium</h4>
        <progress-bar value="65" size="medium"></progress-bar>
      </div>
      <div class="example">
      <h4>Large</h4>
        <progress-bar value="80" size="large"></progress-bar>
      </div>
      
      <h3>Styles</h3>
      <div class="example">
        <h4>Success</h4>
        <progress-bar value="90" theme="success"></progress-bar>
      </div>
      <div class="example">
        <h4>Warning</h4>
        <progress-bar value="60" theme="warning"></progress-bar>
      </div>
      <div class="example">
        <h4>Danger</h4>
        <progress-bar value="30" theme="danger"></progress-bar>
      </div>
      
      <h3>Settings</h3>
      <div class="example">
        <h4>Without Animation</h4>
        <progress-bar value="45" animated="false"></progress-bar>
      </div>
      <div class="example">
        <h4>Without Inline Label</h4>
        <progress-bar value="85" inlinelabel="false"></progress-bar>
      </div>
      <div class="example">
        <h4>Without Label</h4>
        <progress-bar value="85" showlabel="false"></progress-bar>
      </div>
    </div>
  </body>
</html>
