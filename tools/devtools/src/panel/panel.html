<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <button id="refresh-btn" title="Refresh component tree">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M13.65 2.35A7.95 7.95 0 0 0 8 0a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24l-2.24 2.24h6v-6l-2.35 2.35z"/>
        </svg>
      </button>
      <span id="status">Loading...</span>
    </div>

    <div id="main-content">
      <div id="tree-container">
        <div id="tree-view"></div>
      </div>

      <div id="inspector-container">
        <div id="inspector-placeholder">
          <p>Select a component to inspect</p>
        </div>
        <div id="inspector-content" style="display: none;">
          <div id="element-summary"></div>
          <div id="element-details"></div>
        </div>
      </div>
    </div>

    <div id="breadcrumb">
      <span id="selected-element">No element selected</span>
    </div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
