name: Benchmarks

on:
  pull_request:
    paths:
      # perf-sensitive code — the measurement target
      - 'packages/**'
      # bench workflow itself — changes here take effect on this PR's own
      # run (pull_request uses PR-head YAML), so self-test
      - '.github/workflows/benchmarks.yml'
      # reporter scripts — runs from PR-head via the report workflow's
      # checkout step, so a PR that only changes reporter.js still gets
      # its output rendered on its own bench comment. Note: we deliberately
      # DON'T include `.github/workflows/benchmarks-report.yml` here — that
      # file runs from main's copy (workflow_run constraint), so modifying
      # it on a PR doesn't exercise the change until after merge.
      - 'tools/bench-reporter/**'
  # Bench every merge commit on main so bench-history.json accumulates
  # absolute CIs per commit. These runs aren't gated against anything —
  # the report workflow branches on event type and appends history instead
  # of posting a PR comment.
  push:
    branches: [main]
    paths:
      - 'packages/**'

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Discover which tachometer configs are in changed packages.
  # Emits one matrix entry per tachometer-ci*.json so each runs in its own
  # parallel job with its own PR check.
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
      has-benchmarks: ${{ steps.matrix.outputs.has-benchmarks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build matrix
        id: matrix
        run: |
          # Any trigger that reaches this workflow — push to main, or a
          # pull_request whose diff matched our path filter — runs every
          # benchmarkable package's configs. Tachometer configs only live
          # under `packages/renderer/` today, but a change in any other
          # package (reactivity, templating, etc.) can absolutely move
          # renderer's bench numbers via workspace imports. Per-package
          # scoping of the matrix was premature: the benches are end-to-end
          # measurements that pull the whole framework through; treat the
          # set of benchmarkable packages as a single target suite.
          entries=()
          while IFS= read -r config; do
            [ -z "$config" ] && continue
            pkg=$(echo "$config" | cut -d/ -f2)
            name=$(basename "$config" .json)
            entries+=("{\"config\":\"$config\",\"name\":\"$name\",\"package\":\"$pkg\"}")
          done < <(find packages -name 'tachometer-ci*.json' -path '*/bench/tachometer/*' 2>/dev/null | sort)

          if [ ${#entries[@]} -eq 0 ]; then
            matrix="[]"
            has=false
          else
            matrix="[$(IFS=,; echo "${entries[*]}")]"
            has=true
          fi

          echo "result=$matrix" >> "$GITHUB_OUTPUT"
          echo "has-benchmarks=$has" >> "$GITHUB_OUTPUT"
          echo "Benchmark matrix: $matrix"

  benchmarks:
    needs: discover
    if: needs.discover.outputs.has-benchmarks == 'true'
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.discover.outputs.matrix) }}
    name: bench-${{ matrix.entry.name }}
    runs-on: ubuntu-latest
    # Old suite at sampleSize: 50 and timeout: 5 runs ~10-11 min per config
    # including setup. 15-min cap gives safety margin without letting any
    # single cell run forever. PR B's knob tuning (["2%"], 2-min auto-sample
    # cap) will bring real times to ~5-7 min.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install matching chromedriver
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+' | head -1)
          npm install chromedriver@${CHROME_VERSION} --no-save

      # Build current branch benchmark bundles
      - name: Build current
        run: node packages/${{ matrix.entry.package }}/bench/tachometer/build-ci.js current

      # Swap source to the appropriate baseline and build baseline bundles.
      # PR: baseline = base branch tip.
      # Push to main: baseline = this commit's parent (so the delta captures
      #   the merged commit's effect; bench-history indexes the current
      #   commit's absolute CI).
      - name: Build baseline
        run: |
          if [ '${{ github.event_name }}' = 'push' ]; then
            # Fetch enough history to reach the parent commit locally.
            git fetch origin main --depth=2
            git checkout HEAD~1 -- packages/*/src/
          else
            git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
            git checkout FETCH_HEAD -- packages/*/src/
          fi
          node packages/${{ matrix.entry.package }}/bench/tachometer/build-ci.js baseline
          git checkout HEAD -- packages/*/src/

      # Run just this matrix cell's single config.
      # Per-cell auto-sample tail is governed by the config's own `timeout`
      # (tachometer rejects --timeout alongside --config). Hard runaway
      # protection is `timeout-minutes: 10` at the job level above.
      - name: Run benchmark
        run: |
          mkdir -p results
          npx tachometer \
            --config "${{ matrix.entry.config }}" \
            --json-file "results/${{ matrix.entry.package }}-${{ matrix.entry.name }}.json"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.entry.name }}
          path: results/*.json
