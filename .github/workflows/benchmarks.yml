name: Benchmarks

on:
  pull_request:
    paths:
      - 'packages/renderer/**'
      - 'packages/reactivity/**'
      - 'packages/templating/**'
      - 'packages/component/**'
      - 'packages/utils/**'
      - 'packages/query/**'
      - 'packages/compiler/**'

permissions:
  contents: read

jobs:
  benchmarks:
    # Skip forks — secrets aren't available for posting comments
    if: github.repository == 'Semantic-Org/Semantic-Next'
    name: benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install matching chromedriver
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+' | head -1)
          npm install chromedriver@${CHROME_VERSION} --no-save

      # Build current branch (PR) benchmark bundle
      - name: Build current
        run: node packages/renderer/bench/tachometer/build-ci.js current

      # Checkout base branch source and build baseline bundle
      - name: Build baseline
        run: |
          # Swap only source directories — leaves bench/ and config untouched
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          git checkout FETCH_HEAD -- packages/*/src/

          # Build baseline bundle from base branch source
          node packages/renderer/bench/tachometer/build-ci.js baseline

          # Restore PR branch source
          git checkout HEAD -- packages/*/src/

      # Discover and run all tachometer CI configs
      - name: Run benchmarks
        run: |
          mkdir -p results
          for config in $(find packages -name 'tachometer-ci*.json' -path '*/bench/tachometer/*' | sort); do
            name=$(basename "$config" .json)
            pkg=$(echo "$config" | sed 's|packages/\([^/]*\)/.*|\1|')
            echo "::group::Benchmark $pkg/$name"
            npx tachometer --config "$config" --json-file "results/${pkg}-${name}.json"
            echo "::endgroup::"
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/*.json
