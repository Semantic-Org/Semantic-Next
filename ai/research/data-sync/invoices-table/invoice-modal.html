<ui-modal header={isEditing ? 'Edit Invoice' : 'Add Invoice'}>
  {#if isEditing and not detail.ready}
    <ui-spinner />
  {else}
    {#form draft=draft}
      <ui-input name="client" label="Client" autofocus />
      <ui-input name="total" label="Total" type="number" />
      {#if isEditing}
        <ui-input name="notes" label="Notes" textarea />
      {/if}
    {/form}
    {#if draft.stale}
      <ui-label warning>This invoice changed while you were editing</ui-label>
    {/if}
    <ui-button class="save" primary disabled={not draft.dirty}>
      {isEditing ? 'Save' : 'Create'}
    </ui-button>
    <ui-button class="cancel">Cancel</ui-button>
  {/if}
</ui-modal>
