<div class="example-component {theme}">
  <div class="header">
    <h3>{title}</h3>
    <div class="controls">
      <button class="toggle-btn" disabled="{disabled}">
        {#if isExpanded}
          Collapse ▲
        {else}
          Expand ▼
        {/if}
      </button>
    </div>
  </div>
  
  <div class="content">
    <div class="counter">
      <p>Button clicked: <strong>{clicks}</strong> times</p>
      <button class="increment-btn {theme}" disabled="{disabled}">
        Click me! (+1)
      </button>
    </div>
    
    {#if isExpanded}
      <div class="expanded-content">
        <div class="message-section">
          <label for="message">Message:</label>
          <input 
            type="text" 
            class="message-input" 
            value="{message}"
            disabled="{disabled}"
            placeholder="Enter a message...">
          <p class="message-display">Current: <em>{message}</em></p>
        </div>
        
        <div class="debug-info">
          <h4>Debug Information:</h4>
          <ul>
            <li>Theme: <code>{theme}</code></li>
            <li>Disabled: <code>{disabled}</code></li>
            <li>Expanded: <code>{isExpanded}</code></li>
            <li>Total clicks: <code>{clicks}</code></li>
          </ul>
        </div>
      </div>
    {/if}
  </div>
  
  <div class="footer">
    <small>🤖 AI Workspace Example Component</small>
  </div>
</div>
