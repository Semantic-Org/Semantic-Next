<div class="{ui} menu" part="menu">
  {#each item in items}
    <menu-item
      active={isValueActive value item}
      href={item.href}
      data-value={item.value}
      exportparts="item"
    >
      {item.label}
      {#if item.badge}
        <ui-label badge>{item.badge}</ui-label>
      {/if}
    </menu-item>
  {else}
    {>slot}
  {/each}
</div>
